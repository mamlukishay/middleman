<!doctype html>
<meta charset="utf-8">
<title>The relay — how the laptop and the phone talk</title>
<style>
  body { margin: 0; background: #0f1115; color: #e6e8ee; font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  .page { width: 1000px; padding: 28px 32px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9aa3b2; margin: 0 0 18px; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #e8b44a; margin: 22px 0 8px; }
  text { font-family: -apple-system, system-ui, sans-serif; }
  .k { fill: #e8b44a; font-weight: 700; }
</style>
<div class="page">
<h1>The relay</h1>
<p class="sub">Three kinds of message, one mailbox in the middle, and a clock that is agreed on once.</p>

<h2>1 · Today: one brain, one screen</h2>
<svg width="936" height="300" viewBox="0 0 936 300">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs>
  <!-- laptop -->
  <rect x="10" y="60" width="250" height="180" rx="12" fill="#171a21" stroke="#3a4152"/>
  <text x="26" y="88" class="k" font-size="15">Laptop = the brain</text>
  <text x="26" y="112" fill="#e6e8ee" font-size="13">plugged into the piano</text>
  <text x="26" y="132" fill="#e6e8ee" font-size="13">runs the lesson, scores you,</text>
  <text x="26" y="152" fill="#e6e8ee" font-size="13">plays the other hand, clicks</text>
  <text x="26" y="184" fill="#9aa3b2" font-size="12">host.js</text>
  <!-- room -->
  <rect x="343" y="60" width="250" height="180" rx="12" fill="#171a21" stroke="#e8b44a"/>
  <text x="359" y="88" class="k" font-size="15">Room = a mailbox</text>
  <text x="359" y="112" fill="#e6e8ee" font-size="13">on the laptop's own server</text>
  <text x="359" y="132" fill="#e6e8ee" font-size="13">passes every message to</text>
  <text x="359" y="152" fill="#e6e8ee" font-size="13">everyone else in the room,</text>
  <text x="359" y="172" fill="#e6e8ee" font-size="13">and remembers only the last snapshot</text>
  <text x="359" y="200" fill="#9aa3b2" font-size="12">serve.py · one id, e.g. 3wj42z, in the QR</text>
  <!-- phone -->
  <rect x="676" y="60" width="250" height="180" rx="12" fill="#171a21" stroke="#3a4152"/>
  <text x="692" y="88" class="k" font-size="15">Phone = the screen</text>
  <text x="692" y="112" fill="#e6e8ee" font-size="13">draws what the laptop says,</text>
  <text x="692" y="132" fill="#e6e8ee" font-size="13">runs its own playhead from the</text>
  <text x="692" y="152" fill="#e6e8ee" font-size="13">shared clock, sends back taps</text>
  <text x="692" y="184" fill="#9aa3b2" font-size="12">remote.js</text>
  <!-- arrows -->
  <line x1="262" x2="341" y1="100" y2="100" stroke="#9aa3b2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="595" x2="674" y1="100" y2="100" stroke="#9aa3b2" stroke-width="2" marker-end="url(#a)"/>
  <text x="266" y="122" fill="#e6e8ee" font-size="12">snapshot + events</text>
  <line x1="674" x2="595" y1="210" y2="210" stroke="#9aa3b2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="341" x2="262" y1="210" y2="210" stroke="#9aa3b2" stroke-width="2" marker-end="url(#a)"/>
  <text x="272" y="232" fill="#e6e8ee" font-size="12">commands</text>
  <text x="10" y="278" fill="#9aa3b2" font-size="13">Down the wire: a stream that never closes (server-sent events). Up: an ordinary POST per tap. No frames, no ticks, no audio.</text>
</svg>

<h2>2 · The three kinds of message</h2>
<svg width="936" height="230" viewBox="0 0 936 230">
  <g font-size="13">
    <rect x="10" y="10" width="295" height="200" rx="10" fill="#171a21" stroke="#3a4152"/>
    <text x="24" y="36" class="k" font-size="14">Snapshot — "here is everything"</text>
    <text x="24" y="60" fill="#e6e8ee">Sent when something changes: a step</text>
    <text x="24" y="80" fill="#e6e8ee">loads, the tempo moves, a hand switches.</text>
    <text x="24" y="100" fill="#e6e8ee">Carries the clock anchor: "beat 0 was</text>
    <text x="24" y="120" fill="#e6e8ee">at time T" — so the phone never asks</text>
    <text x="24" y="140" fill="#e6e8ee">where the playhead is; it computes it.</text>
    <text x="24" y="170" fill="#9aa3b2" font-size="12">song · step · tempo · hands · range · running</text>
    <text x="24" y="188" fill="#9aa3b2" font-size="12">wait · loop · click · out · anchor T</text>

    <rect x="320" y="10" width="295" height="200" rx="10" fill="#171a21" stroke="#3a4152"/>
    <text x="334" y="36" class="k" font-size="14">Event — "this just happened"</text>
    <text x="334" y="60" fill="#e6e8ee">A few a second at most. Each names the</text>
    <text x="334" y="80" fill="#e6e8ee">note (hand, bar, beat, pitch) so the</text>
    <text x="334" y="100" fill="#e6e8ee">phone colours the same notehead.</text>
    <text x="334" y="120" fill="#e6e8ee">Never replayed: a late phone gets the</text>
    <text x="334" y="140" fill="#e6e8ee">snapshot and starts fresh from there.</text>
    <text x="334" y="170" fill="#9aa3b2" font-size="12">hit · miss · extra · ignored · reset · pass · end</text>
    <text x="334" y="188" fill="#9aa3b2" font-size="12">wait (armed group) · held (keys down) · note (sound)</text>

    <rect x="630" y="10" width="295" height="200" rx="10" fill="#171a21" stroke="#3a4152"/>
    <text x="644" y="36" class="k" font-size="14">Command — "please do this"</text>
    <text x="644" y="60" fill="#e6e8ee">What a tap on the phone means. The</text>
    <text x="644" y="80" fill="#e6e8ee">laptop does it, then a new snapshot</text>
    <text x="644" y="100" fill="#e6e8ee">goes out, so the phone sees the result</text>
    <text x="644" y="120" fill="#e6e8ee">the same way it sees everything else.</text>
    <text x="644" y="170" fill="#9aa3b2" font-size="12">start · stop · seek · bpm · hands · range · wait</text>
    <text x="644" y="188" fill="#9aa3b2" font-size="12">loop · metro · step · next · hear · out …</text>
  </g>
</svg>
</div>
